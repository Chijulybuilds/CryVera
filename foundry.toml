[profile.default]
optimizer = true
optimizer_runs = 50
viaIR = true
src = "src"
out = "out"
libs = ["lib"]
remappings=["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "@openzeppelin/contracts@5.3.0/=lib/openzeppelin-contracts/contracts/", "@chainlink/contracts/=node_modules/@chainlink/contracts/", "@chainlink/ccip/=lib/chainlink-ccip/chains/evm/contracts/"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
